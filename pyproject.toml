[project]
name = "tapegrad"
version = "0.1.0"
description = "Reverse-mode autodiff and a NumPy tensor library from scratch, gradient-checked against PyTorch and trained to an identical loss curve on a character-level transformer"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eshaan Kapooswalla", email = "eshaank@my.yorku.ca" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "torch>=2.3"]
eval = ["matplotlib>=3.8", "torch>=2.3"]

[project.scripts]
tapegrad = "tapegrad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapegrad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP031", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/tapegrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
